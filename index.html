<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wuxing Valve · Products</title>
  <meta name="description" content="Wuxing Valve — industrial valves & fittings. Product cards render from products.json." />
  <meta name="robots" content="index,follow" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg:#f7f7f8; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --brand:#2563eb; --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1150px;margin:0 auto;padding:14px 18px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{height:34px;width:auto;display:block}
    .brandTitle{font-weight:800;letter-spacing:.2px}
    .brandSub{font-size:12px;color:var(--muted);margin-top:2px}
    .lang{display:inline-flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px}
    .lang button{border:0;background:transparent;padding:7px 10px;border-radius:999px;cursor:pointer;font-weight:700;color:#374151}
    .lang button.active{background:var(--brand);color:#fff}
    .contactRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}


/* Shrink header on scroll (mobile only) */
@media (max-width: 620px){
  header{transition:box-shadow .2s ease}
  .wrap{transition:padding .25s ease}
  .contactRow{max-height:120px;overflow:hidden;transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease}
  header.compact .wrap{padding-top:8px;padding-bottom:8px}
  header.compact .logo{height:28px}
  header.compact .brandSub{display:none}
  header.compact .contactRow{max-height:0;opacity:0;margin-top:0;pointer-events:none}
  header.compact{box-shadow:0 6px 20px rgba(0,0,0,.06)}
}
    .chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:#111827}
    .chip small{color:var(--muted)}
    main .wrap{padding-top:22px;padding-bottom:44px}
    h1{font-size:34px;margin:4px 0 8px}
    .intro{color:#374151;line-height:1.6;max-width:900px}
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
    .filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:700;color:#111827}
    .filters button.active{background:var(--brand);border-color:var(--brand);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    @media (max-width: 980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width: 620px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.05);display:flex;flex-direction:column;min-height:340px}
    .cardTop{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .badge{font-size:12px;font-weight:800;background:#111827;color:#fff;border-radius:999px;padding:4px 10px}
    .tag{font-size:12px;color:#374151;background:#eef2ff;border-radius:999px;padding:4px 10px;font-weight:700}
    .imgWrap{padding:10px 14px 0;flex:1;display:flex;align-items:center;justify-content:center}
    .imgWrap img{max-width:100%;max-height:220px;object-fit:contain;border-radius:14px;background:#fff}
    .cardBody{padding:12px 14px 16px}
    .cardTitle{font-weight:900;line-height:1.25;margin:0 0 6px}
    .cardSub{color:var(--muted);font-size:14px;line-height:1.4;margin:0}
    .about{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:0 10px 25px rgba(0,0,0,.05)}
    .about h2{margin:0 0 8px}
    .about p{margin:0;color:#374151;line-height:1.7}
    .about .addr{margin-top:10px;color:#111827;font-weight:800}
    footer{border-top:1px solid var(--line);padding:18px 0;text-align:center;color:var(--muted)}

    /* Mobile: keep contact info from blocking the view */
    @media (max-width: 620px){
      .contactRow{
        flex-wrap:nowrap;
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
        gap:8px;
        margin-top:10px;
        padding-bottom:6px;
        scrollbar-width:none;
      }
      .contactRow::-webkit-scrollbar{display:none}
      .chip{
        flex:0 0 auto;
        padding:6px 10px;
        font-size:13px;
        white-space:nowrap;
      }
      .chip small{display:none}
      .logo{height:30px}
      h1{font-size:28px}
    }

    /* Consent bar */
    .consent{position:fixed;left:14px;right:14px;bottom:14px;z-index:60;display:none}
    .consentBox{max-width:1150px;margin:0 auto;background:#111827;color:#fff;border-radius:16px;padding:14px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    .consentBox .msg{font-size:14px;line-height:1.4;opacity:.95}
    .consentBox .actions{display:flex;gap:10px;flex-wrap:wrap}
    .consentBox button,.consentBox a{border:0;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer}
    .consentBox button.accept{background:#22c55e;color:#052e16}
    .consentBox button.decline{background:#374151;color:#fff}
    .consentBox a{background:#fff;color:#111827;display:inline-flex;align-items:center}
  </style>
</head>
<body>
<header id="siteHeader">
  <div class="wrap">
    <div class="topbar">

        <img class="logo" src="assets/logo.png" alt="Wuxing Valve logo" />
        <div>
          <div class="brandTitle">Wuxing Valve</div>
          <div class="brandSub" id="brandSub">工业阀门 · 外贸供应</div>
        </div>
      </a>
      <div class="lang" role="tablist" aria-label="Language switch">
        <button data-lang="zh" class="active">ZH</button>
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
        <button data-lang="de">DE</button>
      </div>
    </div>

    
<div class="contactRow">
    <a class="chip" href="mailto:wengandy128@gmail.com">📧 <small>邮箱:</small> wengandy128@gmail.com</a>
    <a class="chip" href="https://wa.me/8615888791812" target="_blank" rel="noopener">💬 <small>WhatsApp</small> +86 15888791812</a>
    <a class="chip" href="tel:+8615888791812">📞 <small>电话:</small> +86 15888791812</a>
    <span class="chip">🟩 <small>微信:</small> 15888791812</span>
  </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 id="pageTitle">产品展示</h1>
    <div class="intro" id="pageIntro"></div>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>

    <section class="about" id="aboutBox">
      <h2 id="aboutTitle">关于我们</h2>
      <p id="aboutText"></p>
      <div class="addr"><span id="addrLabel">地址</span>：<span id="addrText"></span></div>
    </section>

</main>

<div class="consent" id="consent">
  <div class="consentBox">
    <div class="msg" id="consentMsg"></div>
    <div class="actions">
      <button class="accept" id="btnAccept">Accept</button>
      <button class="decline" id="btnDecline">Decline</button>
      <a href="privacy.html" id="btnPrivacy">Privacy</a>
    </div>
  </div>
</div>

<script>
  const GA4_ID = "G-1T6921REMX";
  const DATA_URL = "products.json";
  const SUPPORTED = ["zh","en","es","de"];

  const I18N = {"all": {"zh": "全部", "en": "All", "es": "Todo", "de": "Alle"}, "fert": {"zh": "化肥应用", "en": "Fertilizer", "es": "Fertilizantes", "de": "Düngemittel"}, "control": {"zh": "控制/切断阀", "en": "Control & Isolation", "es": "Control y aislamiento", "de": "Regel/Absperr"}, "check": {"zh": "止回阀", "en": "Check valves", "es": "Retención", "de": "Rückschlag"}, "ball": {"zh": "球阀", "en": "Ball valves", "es": "Bola", "de": "Kugel"}, "fittings": {"zh": "管件/密封", "en": "Fittings & sealing", "es": "Accesorios y sellado", "de": "Formteile/Dichtung"}, "certificates": {"zh": "资质证书", "en": "Certificates", "es": "Certificados", "de": "Zertifikate"}, "title": {"zh": "产品展示", "en": "Products", "es": "Productos", "de": "Produkte"}, "intro": {"zh": "Wuxing Valve 提供工业阀门产品与定制服务，支持 OEM/ODM、现货与项目配套。欢迎询盘获取参数表、材质/标准、测试报告与交期。", "en": "Wuxing Valve provides industrial valves and customization services (OEM/ODM), in‑stock supply and project support. Contact us for datasheets, materials/standards, test reports and lead time.", "es": "Wuxing Valve ofrece válvulas industriales y servicios de personalización (OEM/ODM), suministro en stock y soporte para proyectos. Contáctenos para fichas técnicas, materiales/normas, informes de prueba y plazo de entrega.", "de": "Wuxing Valve bietet Industriearmaturen und kundenspezifische Lösungen (OEM/ODM), Lagerware sowie Projektunterstützung. Kontaktieren Sie uns für Datenblätter, Werkstoffe/Normen, Prüfberichte und Lieferzeit."}, "about": {"zh": "关于我们", "en": "About us", "es": "Sobre nosotros", "de": "Über uns"}, "addr": {"zh": "地址", "en": "Address", "es": "Dirección", "de": "Adresse"}, "analytics_msg": {"en": "We use Google Analytics 4 (GA4) only with your consent.", "es": "Usamos Google Analytics 4 (GA4) solo con su consentimiento.", "de": "Wir verwenden Google Analytics 4 (GA4) nur mit Ihrer Zustimmung."}, "accept": {"en": "Accept", "es": "Aceptar", "de": "Akzeptieren"}, "decline": {"en": "Decline", "es": "Rechazar", "de": "Ablehnen"}, "learn": {"en": "Privacy", "es": "Privacidad", "de": "Datenschutz"}};
  const ABOUT = {"zh": "浙江五星阀门有限公司原系永嘉五星阀门总厂，始建于上世纪80年代，位于“泵阀之乡”温州瓯北。公司占地约15000㎡，配备数控机床及理化/计量/无损检测能力，通过 ISO9001 及国家特种设备（压力管道）相关认证。主营高压角式截止阀、止回阀、平衡阀、闸阀、保温阀、硬密封球阀、高压管件及钛合金阀门，广泛应用于化工、化肥、制药、供热、石化等行业。", "en": "Zhejiang Wuxing Valve Co., Ltd. (formerly Yongjia Wuxing Valve Factory) was founded in the 1980s in Oubei, Wenzhou—China’s well‑known pump & valve hub. Our industrial park covers about 15,000 m² with CNC machining, physical/chemical testing, metrology and NDT capabilities. We are certified to ISO 9001 and hold relevant special‑equipment approvals for pressure piping. We manufacture high‑pressure angle globe/throttle valves, check valves, balanced valves, gate valves, jacketed valves, hard‑seated ball valves, high‑pressure fittings and titanium‑alloy valves for chemical, fertilizer, pharma, heating and petrochemical industries.", "es": "Zhejiang Wuxing Valve Co., Ltd. (antes Yongjia Wuxing Valve Factory) fue fundada en la década de 1980 en Oubei, Wenzhou, reconocida zona industrial de bombas y válvulas. Contamos con un parque industrial de ~15.000 m², con mecanizado CNC, laboratorio físico‑químico, metrología y capacidad de END (NDT). Estamos certificados ISO 9001 y disponemos de aprobaciones relacionadas con equipos especiales para tuberías a presión. Fabricamos válvulas de globo/estrangulación en ángulo de alta presión, válvulas de retención, válvulas balanceadas, válvulas de compuerta, válvulas con camisa calefactora, válvulas de bola de asiento duro, accesorios de alta presión y válvulas de aleación de titanio para los sectores químico, fertilizantes, фарма, calefacción y petroquímico.", "de": "Zhejiang Wuxing Valve Co., Ltd. (ehemals Yongjia Wuxing Valve Factory) wurde in den 1980er‑Jahren in Oubei, Wenzhou – einem bekannten Pumpen‑ und Ventilcluster – gegründet. Unser Industriegelände umfasst ca. 15.000 m² mit CNC‑Fertigung sowie physikalisch/chemischer Prüfung, Messtechnik und ZfP/NDT. Wir sind nach ISO 9001 zertifiziert und verfügen über relevante Zulassungen für Druckleitungen. Wir fertigen Hochdruck‑Winkel‑Globe/Drosselventile, Rückschlagventile, Ausgleichsventile, Schieber, Heizmantel‑Ventile, hartdichtende Kugelhähne, Hochdruck‑Rohrformteile sowie Titanlegierungs‑Ventile für Chemie, Düngemittel, Pharma, Wärmeversorgung und Petrochemie."};
  const ADDRESS = {"zh": "浙江省永嘉县瓯北五星工业区", "en": "Wuxing Industrial Zone, Oubei, Yongjia County, Zhejiang, China", "es": "Zona Industrial Wuxing, Oubei, Condado de Yongjia, Zhejiang, China", "de": "Wuxing Industriegebiet, Oubei, Landkreis Yongjia, Zhejiang, China"};

  function getLang() {
    const u = new URL(location.href);
    const q = (u.searchParams.get("lang") || "").toLowerCase();
    const stored = (localStorage.getItem("lang") || "").toLowerCase();
    return SUPPORTED.includes(q) ? q : (SUPPORTED.includes(stored) ? stored : "zh");
  }
  function setLang(lang) {
    localStorage.setItem("lang", lang);
    const u = new URL(location.href);
    u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.toString());
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
    applyText(lang);
    render();
    maybeInitGA4(lang);
  }

  function t(key, lang) {
    return (I18N[key] && I18N[key][lang]) || (I18N[key] && I18N[key]["en"]) || "";
  }

  function applyText(lang) {
    document.documentElement.lang = lang;
    document.getElementById("pageTitle").textContent = t("title", lang);
    document.getElementById("pageIntro").textContent = t("intro", lang);
    document.getElementById("aboutTitle").textContent = t("about", lang);
    document.getElementById("aboutText").textContent = ABOUT[lang] || ABOUT.en;
    document.getElementById("addrLabel").textContent = t("addr", lang);
    document.getElementById("addrText").textContent = ADDRESS[lang] || ADDRESS.en;
  }

  async function fetchJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("Failed to load " + url);
    return await r.json();
  }

  let ALL = [];
  let activeFilter = "all";

  function buildFilters(lang) {
    const filters = [
      { key:"all", type:"all" },
      { key:"fert", type:"tag", tag:"fertilizer" },
      { key:"control", type:"family", family:"control" },
      { key:"check", type:"family", family:"check" },
      { key:"ball", type:"family", family:"ball" },
      { key:"fittings", type:"family", family:"fittings" },
      { key:"certificates", type:"family", family:"certificates" },
    ];
    const box = document.getElementById("filters");
    box.innerHTML = "";
    filters.forEach(f => {
      const btn = document.createElement("button");
      btn.textContent = t(f.key, lang);
      btn.className = (activeFilter === f.key) ? "active" : "";
      btn.addEventListener("click", () => {
        activeFilter = f.key;
        buildFilters(lang);
        renderCards(lang);
      });
      box.appendChild(btn);
    });
  }

  function matchFilter(p) {
    if (activeFilter === "all") return true;
    if (activeFilter === "fert") return (p.tags || []).includes("fertilizer") && p.family !== "certificates";
    if (activeFilter === "control") return p.family === "control";
    if (activeFilter === "check") return p.family === "check";
    if (activeFilter === "ball") return p.family === "ball";
    if (activeFilter === "fittings") return p.family === "fittings";
    if (activeFilter === "certificates") return p.family === "certificates";
    return true;
  }

  function renderCards(lang) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const list = ALL.filter(matchFilter);
    list.forEach(p => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `product.html?id=${encodeURIComponent(p.id)}&lang=${encodeURIComponent(lang)}`;
      a.innerHTML = `
        <div class="cardTop">
          <span class="badge">${(p.family_title?.[lang] || p.family_title?.en || p.family || "").toString()}</span>
          <span class="tag">${(p.tags || []).includes("fertilizer") ? t("fert", lang) : ""}</span>
        </div>
        <div class="imgWrap">
          <img src="${p.cover}" alt="${p.title?.[lang] || p.title?.en || ""}" loading="lazy" />
        </div>
        <div class="cardBody">
          <div class="cardTitle">${p.title?.[lang] || p.title?.en || ""}</div>
          <p class="cardSub">${p.sub?.[lang] || p.sub?.en || ""}</p>
        </div>
      `;
      grid.appendChild(a);
    });
  }

  async function render() {
    const lang = getLang();
    buildFilters(lang);
    if (ALL.length === 0) {
      try {
        const data = await fetchJSON(DATA_URL);
        ALL = Array.isArray(data.products) ? data.products : [];
      } catch (e) {
        console.error(e);
        document.getElementById("grid").innerHTML = `<div style="color:#b91c1c;font-weight:800">Failed to load products.json</div>`;
      }
    }
    renderCards(lang);
  }

  function loadGA4() {
    if (window.__ga4_loaded) return;
    window.__ga4_loaded = true;
    const s = document.createElement("script");
    s.async = true;
    s.src = `https://www.googletagmanager.com/gtag/js?id=${GA4_ID}`;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', GA4_ID);
  }

  function consentKey(lang) { return `ga4_consent_${lang}`; }

  function maybeInitGA4(lang) {
    const consent = document.getElementById("consent");
    if (lang === "zh") {
      consent.style.display = "none";
      loadGA4();
      return;
    }
    const key = consentKey(lang);
    const state = localStorage.getItem(key);
    if (state === "granted") {
      consent.style.display = "none";
      loadGA4();
      return;
    }
    if (state === "denied") {
      consent.style.display = "none";
      return;
    }
    // ask
    const msg = document.getElementById("consentMsg");
    msg.textContent = I18N.analytics_msg[lang] || I18N.analytics_msg.en;
    document.getElementById("btnAccept").textContent = I18N.accept[lang] || "Accept";
    document.getElementById("btnDecline").textContent = I18N.decline[lang] || "Decline";
    document.getElementById("btnPrivacy").textContent = I18N.learn[lang] || "Privacy";
    consent.style.display = "block";
    document.getElementById("btnAccept").onclick = () => {
      localStorage.setItem(key, "granted");
      consent.style.display = "none";
      loadGA4();
    };
    document.getElementById("btnDecline").onclick = () => {
      localStorage.setItem(key, "denied");
      consent.style.display = "none";
    };
  }

  document.querySelectorAll('.lang button').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });

  // init
  const lang = getLang();
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  applyText(lang);
  render();
  maybeInitGA4(lang);
</script>

  <script>
(function(){
  const header = document.getElementById('siteHeader');
  if(!header) return;

  const mq = window.matchMedia('(max-width: 620px)');
  let compact = false;

  const onScroll = () => {
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    // enter compact after 60px, exit when back near top
    if(!compact && y > 60){
      header.classList.add('compact');
      compact = true;
    }else if(compact && y < 10){
      header.classList.remove('compact');
      compact = false;
    }
  };

  const apply = () => {
    if(mq.matches){
      window.addEventListener('scroll', onScroll, {passive:true});
      onScroll();
    }else{
      window.removeEventListener('scroll', onScroll);
      header.classList.remove('compact');
      compact = false;
    }
  };

  if(mq.addEventListener) mq.addEventListener('change', apply);
  else mq.addListener(apply); // Safari fallback

  apply();
})();
</script>

</body>
