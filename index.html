<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wuxing Valve · Products</title>

  <meta name="description" content="Wuxing Valve — industrial valve product showcase. Cards render from products.json." />
  <meta property="og:title" content="Wuxing Valve · Products" />
  <meta property="og:description" content="Industrial valve product showcase with multi-language pages." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og.jpg" />
  <meta property="og:url" content="/" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root{
      --bg:#f7f8fa; --text:#222; --muted:#555; --primary:#2b7de9;
      --card:#fff; --border:#ddd; --ring:rgba(43,125,233,.18);
      --shadow:0 2px 10px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
    .brand{display:flex;gap:10px;align-items:center}
    .brand a{color:var(--text);text-decoration:none;font-weight:900;letter-spacing:.3px}
    .brand small{color:var(--muted);font-weight:700}
    .logoLink{display:flex;align-items:center;text-decoration:none}
    .logoImg{height:34px;width:auto;display:block}

    .lang{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px}
    .lang button{appearance:none;border:none;cursor:pointer;padding:6px 10px;border-radius:999px;color:var(--muted);background:transparent;font-weight:700}
    .lang button.active{color:#fff;background:var(--primary);box-shadow:0 0 0 6px var(--ring) inset}

    .wrap{max-width:1200px;margin:0 auto;padding:18px 16px 56px}
    h1{font-size:28px;margin:10px 0 8px}
    p.lead{color:var(--muted);margin:0 0 10px;line-height:1.6;max-width:980px}

    .contactbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 12px}
    .contactbar a,.contactbar span{background:#fff;border:1px solid var(--border);padding:8px 10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:14px}
    .contactbar a:hover{background:#f1f5ff;border-color:#cfe0ff}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
    .pill{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;color:var(--muted);cursor:pointer}
    .pill.active{background:var(--primary);border-color:var(--primary);color:#fff}

    .grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:24px}
    @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}

    .card{position:relative;overflow:hidden;border-radius:14px;background:var(--card);border:1px solid var(--border);
      box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease}
    .card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.12)}
    .thumb{aspect-ratio:4/3;width:100%;display:block;object-fit:cover;background:#f1f3f5}
    .body{padding:12px 14px 16px}
    .title{font-weight:900;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}
    .desc{color:var(--muted);margin:0;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .badge{position:absolute;top:10px;left:10px;background:#111;color:#fff;padding:2px 8px;border-radius:999px;font-size:12px;opacity:.85}
    .cardlink{display:block;text-decoration:none;color:inherit}

    .mutebox{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:12px 14px;color:var(--muted);line-height:1.6;margin-top:16px}

    footer{border-top:1px solid var(--border);text-align:center;padding:14px;color:var(--muted);margin-top:26px}

    /* Cookie banner (shows for EN/DE only) */
    .cookie-wrap{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none}
    .cookie-bar{max-width:1200px;margin:10px auto;background:#111;color:#fff;border-radius:12px;padding:14px;border:1px solid #000a;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
    .cookie-bar p{margin:0;line-height:1.5;flex:1 1 320px;color:#e6e6e6}
    .cookie-bar a{color:#9ec5ff}
    .cookie-actions{display:flex;gap:8px}
    .cookie-actions button{cursor:pointer;border:none;border-radius:10px;padding:8px 12px;font-weight:800}
    .cookie-accept{background:#2b7de9;color:#fff}
    .cookie-reject{background:#fff;color:#111;border:1px solid #ccc}
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <a href="./" class="logoLink" aria-label="Home">
        <img src="assets/logo.png" alt="Wuxing Valve" class="logoImg">
      </a>
      <small id="brandSub">Industrial Valves</small>
    </div>

    <div class="lang" id="langSwitcher" aria-label="language">
      <button data-lang="zh">ZH</button>
      <button data-lang="en">EN</button>
      <button data-lang="es">ES</button>
      <button data-lang="de">DE</button>
    </div>
  </header>

  <div class="wrap">
    <div class="contactbar" id="contactBar"></div>

    <h1 id="heading">产品展示</h1>
    <p class="lead" id="sub"></p>

    <div class="filters" id="filters"></div>

    <div class="grid" id="grid"></div>

    <div class="mutebox" id="hintBox" style="display:none"></div>
  </div>

  <footer>© <span id="y"></span> Wuxing Valve</footer>

  <div class="cookie-wrap" id="cookieWrap" aria-live="polite">
    <div class="cookie-bar">
      <p id="cookieText">
        We use cookies (only Google Analytics) to understand traffic and improve our site. You can accept or reject non-essential cookies.
        See our <a href="/privacy.html" target="_blank" rel="noopener">Privacy Notice</a>.
      </p>
      <div class="cookie-actions">
        <button class="cookie-reject" id="cookieReject">Reject</button>
        <button class="cookie-accept" id="cookieAccept">Accept</button>
      </div>
    </div>
  </div>

  <script>
/* ---------- i18n ---------- */
const I18N = {
  zh:{
    brandSub:'工业阀门 · 外贸供应',
    title:'产品展示',
    sub:'Wuxing Valve 提供工业阀门产品与定制服务，支持 OEM/ODM、现货与项目配套。欢迎询盘获取参数表、材质/标准、测试报告与交期。',
    email:'邮件',whats:'WhatsApp',phone:'电话',wechat:'微信',
    all:'全部',
    fertilizer:'化肥用',
    certificates:'资质证书',
    hintNoJson:'未找到 products.json。请把 products.json 上传到仓库根目录（与 index.html 同级）。',
    hintEmpty:'products.json 读取成功，但没有产品数据。',
    hintImg:'部分图片加载失败。请确认图片路径是 assets/products/<id>/cover.jpg，并且文件名大小写一致。',
    cookieMsg:'我们使用 Google Analytics 来了解访问情况并改进网站。英文/西语/德语页面将征得同意后再收集。'
  },
  en:{
    brandSub:'Industrial Valves · Supply',
    title:'Products',
    sub:'Wuxing Valve supplies industrial valves with OEM/ODM, RTS and project support. Contact us for specs, materials/standards, test reports and lead time.',
    email:'Email',whats:'WhatsApp',phone:'Phone',wechat:'WeChat',
    all:'All',
    fertilizer:'Fertilizer Service',
    certificates:'Qualifications',
    hintNoJson:'products.json not found. Upload it to the repo root (same level as index.html).',
    hintEmpty:'products.json loaded, but no products found.',
    hintImg:'Some images failed to load. Ensure cover paths are like assets/products/<id>/cover.jpg and filenames match case.',
    cookieMsg:'We use cookies (only Google Analytics) to understand traffic and improve our site. You can accept or reject non-essential cookies. See our {privacy}.',
    cookieAccept:'Accept',
    cookieReject:'Reject',
    privacyLink:'Privacy Notice'
  },
  es:{
    brandSub:'Válvulas industriales · Suministro',
    title:'Productos',
    sub:'Wuxing Valve suministra válvulas industriales con OEM/ODM, RTS y soporte para proyectos. Contáctenos para fichas técnicas, materiales/estándares, informes de prueba y plazo de entrega.',
    email:'Correo',whats:'WhatsApp',phone:'Teléfono',wechat:'WeChat',
    all:'Todo',
    fertilizer:'Servicio para Fertilizantes',
    certificates:'Certificados',
    hintNoJson:'No se encontró products.json. Cárguelo en la raíz del repositorio (al mismo nivel que index.html).',
    hintEmpty:'products.json se cargó, pero no hay productos.',
    hintImg:'Algunas imágenes no se pudieron cargar. Verifique rutas como assets/products/<id>/cover.jpg y que el nombre coincida (mayúsculas/minúsculas).',
    cookieMsg:'Usamos cookies (solo Google Analytics) para entender el tráfico y mejorar el sitio. Puedes aceptar o rechazar cookies no esenciales. Consulta nuestra {privacy}.',
    cookieAccept:'Aceptar',
    cookieReject:'Rechazar',
    privacyLink:'Política de Privacidad'
  },
  de:{
    brandSub:'Industrieventile · Supply',
    title:'Produkte',
    sub:'Wuxing Valve liefert Industrieventile mit OEM/ODM, Lagerware und Projekt-Support. Kontaktieren Sie uns für Spezifikationen, Materialien/Normen, Prüfberichte und Lieferzeit.',
    email:'E-Mail',whats:'WhatsApp',phone:'Telefon',wechat:'WeChat',
    all:'Alle',
    fertilizer:'Düngerindustrie',
    certificates:'Zertifikate',
    hintNoJson:'products.json nicht gefunden. Bitte im Repo-Root hochladen (gleiche Ebene wie index.html).',
    hintEmpty:'products.json geladen, aber keine Produkte gefunden.',
    hintImg:'Einige Bilder konnten nicht geladen werden. Pfade wie assets/products/<id>/cover.jpg verwenden und Groß-/Kleinschreibung beachten.',
    cookieMsg:'Wir verwenden Cookies (nur Google Analytics), um den Traffic zu verstehen und unsere Website zu verbessern. Du kannst nicht notwendige Cookies akzeptieren oder ablehnen. Siehe {privacy}.',
    cookieAccept:'Akzeptieren',
    cookieReject:'Ablehnen',
    privacyLink:'Datenschutzhinweis'
  }
};

const qs = new URLSearchParams(location.search);
const currentLang = (qs.get('lang') || localStorage.getItem('lang') || 'zh').toLowerCase();
localStorage.setItem('lang', currentLang);
const t = I18N[currentLang] || I18N.zh;

// Tag filter: ?tag=fertilizer
const currentTag = (qs.get('tag') || '').toLowerCase();
let filterMode = currentTag ? 'tag' : 'series';

document.getElementById('brandSub').textContent = t.brandSub;
document.getElementById('heading').textContent = t.title;
document.getElementById('sub').textContent = t.sub;

[...document.querySelectorAll('#langSwitcher button')].forEach(b=>{
  if(b.dataset.lang===currentLang) b.classList.add('active');
  b.onclick=()=>{
    const lang=b.dataset.lang;localStorage.setItem('lang',lang);
    const url=new URL(location.href);
    url.searchParams.set('lang',lang);
    location.href=url.toString();
  };
});

/* ---------- contacts (edit here) ---------- */
const CONTACT={email:'wengandy128@gmail.com',whatsapp:'+86 15888791812',phone:'+86 15888791812',wechat:'15888791812'};
document.getElementById('contactBar').innerHTML=`
  <a href="mailto:${CONTACT.email}">📧 ${t.email}: ${CONTACT.email}</a>
  <a href="https://wa.me/${CONTACT.whatsapp.replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">💬 ${t.whats}</a>
  <a href="tel:${CONTACT.phone.replace(/\s/g,'')}">📞 ${t.phone}: ${CONTACT.phone}</a>
  <span>🟩 ${t.wechat}: ${CONTACT.wechat}</span>
`;

/* ---------- cookie consent + GA (optional) ---------- */
const GA_ID = 'G-1T6921REMX'; // your GA4 id
function loadGA(){
  if(!GA_ID || GA_ID==='G-REPLACE_ME') return;
  if(window.__gaLoaded) return;
  window.__gaLoaded = true;
  const s=document.createElement('script');
  s.async=true; s.src=`https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  window.gtag = gtag;
  gtag('js', new Date());
  gtag('config', GA_ID);
}
function disableGA(){ if(GA_ID && GA_ID!=='G-REPLACE_ME') window['ga-disable-'+GA_ID] = true; }

// Localize cookie banner only for EN/ES/DE
const consentKey='cookieConsent:v1';
const saved = localStorage.getItem(consentKey);

if(currentLang==='zh'){
  // Chinese: load GA without notice
  loadGA();
}else{
  const wrap = document.getElementById('cookieWrap');
  const cookieP = document.getElementById('cookieText');
  const btnA = document.getElementById('cookieAccept');
  const btnR = document.getElementById('cookieReject');

  // Set localized strings
  const privacyA = `<a href="/privacy.html" target="_blank" rel="noopener">${(t.privacyLink||'Privacy')}</a>`;
  if(cookieP){
    cookieP.innerHTML = (t.cookieMsg || '').replace('{privacy}', privacyA);
  }
  if(btnA) btnA.textContent = t.cookieAccept || 'Accept';
  if(btnR) btnR.textContent = t.cookieReject || 'Reject';

  function show(){ wrap.style.display='block'; }
  function hide(){ wrap.style.display='none'; }

  if(!saved){
    disableGA(); show();
  }else{
    try{
      const st = JSON.parse(saved);
      if(st.status==='accepted') loadGA(); else disableGA();
    }catch{ disableGA(); show(); }
  }
  btnA.onclick=()=>{
    localStorage.setItem(consentKey, JSON.stringify({status:'accepted',ts:Date.now()}));
    hide(); loadGA();
  };
  btnR.onclick=()=>{
    localStorage.setItem(consentKey, JSON.stringify({status:'rejected',ts:Date.now()}));
    hide(); disableGA();
  };
}

/* ---------- helpers ---------- */
function pickLangText(v){
  if(!v) return '';
  if(typeof v === 'string') return v;
  return v[currentLang] || v.zh || v.en || v.es || v.de || '';
}

async function fetchJSON(url){
  try{
    const r = await fetch(url, {cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){}
  return null;
}

function imgFallback(el){
  el.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
      <rect width="100%" height="100%" fill="#f1f3f5"/>
      <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        fill="#9aa0a6" font-family="Arial" font-size="20">Image not found</text>
    </svg>`
  );
}

let ALL = [];
let currentSeries = 'all';

function setURL(params){
  const url = new URL(location.href);
  for(const [k,v] of Object.entries(params)){
    if(v===null) url.searchParams.delete(k);
    else url.searchParams.set(k,v);
  }
  url.searchParams.set('lang', currentLang);
  location.href = url.toString();
}

function renderFilters(seriesList){
  const box = document.getElementById('filters');
  box.innerHTML = '';

  const mk = (label, isActive, onclick)=>{
    const b = document.createElement('button');
    b.className = 'pill' + (isActive ? ' active':'');
    b.textContent = label;
    b.onclick = onclick;
    box.appendChild(b);
  };

  // All
  mk(t.all, filterMode==='series' && currentSeries==='all', ()=>{
    filterMode='series'; currentSeries='all';
    setURL({tag:null});
  });

  // Fertilizer column (tag)
  mk(t.fertilizer, filterMode==='tag' && currentTag==='fertilizer', ()=>{
    filterMode='tag';
    setURL({tag:'fertilizer'});
  });

  // Series pills
  seriesList.forEach(s=>{
    const label = pickLangText(s.series_title) || s.series;
    mk(label, filterMode==='series' && s.series===currentSeries, ()=>{
      filterMode='series';
      currentSeries = s.series;
      setURL({tag:null});
    });
  });
}

function filterItems(){
  if(filterMode==='tag' && currentTag){
    return ALL.filter(p => (p.tags||[]).map(x=>String(x).toLowerCase()).includes(currentTag));
  }
  return currentSeries==='all' ? ALL : ALL.filter(p=>p.series===currentSeries);
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const hint = document.getElementById('hintBox');
  hint.style.display='none'; hint.textContent='';
  grid.innerHTML = '';

  const items = filterItems();
  if(!items.length){
    hint.style.display='block';
    hint.textContent = t.hintEmpty;
    return;
  }

  let imgError = 0;
  for(const p of items){
    const title = pickLangText(p.title) || p.id;
    const desc  = pickLangText(p.sub) || '';
    const cover = p.cover || '';
    const badge = (pickLangText(p.series_title) || p.series || '').slice(0,12) || currentLang.toUpperCase();

    const a = document.createElement('a');
    a.className = 'cardlink';
    const u = new URL('product.html', location.href);
    u.searchParams.set('id', p.id);
    u.searchParams.set('lang', currentLang);
    a.href = u.toString();

    a.innerHTML = `<article class="card">
      <img class="thumb" src="${cover}" alt="${title}">
      <div class="body">
        <div class="title">${title}</div>
        <p class="desc">${desc}</p>
      </div>
      <span class="badge">${badge}</span>
    </article>`;

    const img = a.querySelector('img.thumb');
    img.onerror = ()=>{ imgError++; imgFallback(img); };
    if(!cover) img.onerror();

    grid.appendChild(a);
  }

  if(imgError >= 2){
    hint.style.display='block';
    hint.textContent = t.hintImg;
  }
}

async function init(){
  const data = await fetchJSON('products.json') || await fetchJSON('/products.json') || await fetchJSON('./products.json');
  if(!data){
    const hint = document.getElementById('hintBox');
    hint.style.display='block';
    hint.textContent = t.hintNoJson;
    return;
  }
  ALL = Array.isArray(data.products) ? data.products : (Array.isArray(data) ? data : []);
  if(!ALL.length){
    const hint = document.getElementById('hintBox');
    hint.style.display='block';
    hint.textContent = t.hintEmpty;
    return;
  }

  // unique series list (preserve first title)
  const map = new Map();
  for(const p of ALL){
    if(!p.series) continue;
    if(!map.has(p.series)) map.set(p.series, {series:p.series, series_title:p.series_title});
  }
  const seriesList = [...map.values()];
  renderFilters(seriesList);

  // if URL came with ?tag=..., ensure mode is tag
  if(currentTag){ filterMode='tag'; }

  renderGrid();
}

init();
document.getElementById('y').textContent=new Date().getFullYear();
  </script>
</body>
</html>
