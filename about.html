    :root{
      --bg:#f7f7f8; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --brand:#2563eb; --radius:18px; --shadow:0 10px 30px rgba(0,0,0,.08);
      --max:1100px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    header{
      position:sticky;top:0;z-index:50;
      background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid var(--line)
    }
    .wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
    .nav{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 0;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .logo{
      width:34px;height:34px;border-radius:10px;
      display:block;object-fit:contain;
      box-shadow:0 8px 20px rgba(17,24,39,.12);
    }
    .brand b{letter-spacing:.2px}
    .links{display:flex;gap:14px;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 12px;border-radius:12px;border:1px solid var(--line);
      background:#fff;
    }
    .btn.primary{border-color:rgba(37,99,235,.35);background:rgba(37,99,235,.06)}
    main{padding:28px 0 56px}
    .hero{
      background:linear-gradient(135deg, rgba(37,99,235,.10), rgba(96,165,250,.08));
      border:1px solid rgba(37,99,235,.15);
      border-radius:24px;
      padding:22px 18px;
      box-shadow:var(--shadow);
    }
    .hero h1{margin:0 0 8px;font-size:28px}
    .hero p{margin:0;color:var(--muted);line-height:1.65}
    .card{
      margin-top:18px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:18px;
      box-shadow:var(--shadow);
    }
    .card h2{margin:0 0 10px;font-size:18px}
    .card p{margin:0 0 12px;line-height:1.85}
    .card p:last-child{margin-bottom:0}
    .note{
      margin-top:14px;
      font-size:13px;color:var(--muted);
    }
    footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px}
