backend:
  name: git-gateway
  branch: main

site_url: "https://stellar-capybara-bc6320.netlify.app"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  # 1) 页面（可选）
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/index.njk"
        label: "Homepage"
        name: "home"
        fields:
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text", required: false }
          - { label: "Contact Email", name: "contact_email", widget: "string", required: false }
          - { label: "Contact WhatsApp", name: "contact_whatsapp", widget: "string", required: false }

  # 2) 产品（B+2：一产品一文件）
  - name: "products"
    label: "Products"
    label_singular: "Product"
    folder: "content/products"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{fields.title_en}} ({{fields.sku}})"
    fields:
      - { label: "SKU", name: "sku", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "用于 URL，如 product-1a（只写小写/数字/中横线）" }

      - label: "Title (ZH)"
        name: "title_zh"
        widget: "string"
      - label: "Title (EN)"
        name: "title_en"
        widget: "string"
      - label: "Title (DE)"
        name: "title_de"
        widget: "string"

      - label: "Short Description (ZH)"
        name: "desc_zh"
        widget: "text"
        required: false
      - label: "Short Description (EN)"
        name: "desc_en"
        widget: "text"
        required: false
      - label: "Short Description (DE)"
        name: "desc_de"
        widget: "text"
        required: false

      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false

      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false

      - label: "Specs / Parameters"
        name: "params"
        widget: "list"
        required: false
        fields:
          - { label: "Key", name: "k", widget: "string" }
          - { label: "Value", name: "v", widget: "string" }

      - label: "Details (Markdown Body)"
        name: "body"
        widget: "markdown"
        required: false
