<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wuxing Valve · Product</title>
  <meta name="robots" content="index,follow" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg:#f7f7f8; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --brand:#2563eb; --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1150px;margin:0 auto;padding:14px 18px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{height:34px;width:auto;display:block}
    .brandTitle{font-weight:800;letter-spacing:.2px}
    .brandSub{font-size:12px;color:var(--muted);margin-top:2px}
    .lang{display:inline-flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px}
    .lang button{border:0;background:transparent;padding:7px 10px;border-radius:999px;cursor:pointer;font-weight:700;color:#374151}
    .lang button.active{background:var(--brand);color:#fff}
    main .wrap{padding-top:22px;padding-bottom:44px}
    .crumbs{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px}
    .layout{display:grid;grid-template-columns: 1.2fr .8fr;gap:18px}
    @media (max-width: 980px){.layout{grid-template-columns:1fr}}
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 25px rgba(0,0,0,.05)}
    .panelPad{padding:16px 18px}
    h1{margin:0 0 6px;font-size:32px;line-height:1.2}
    .sub{color:var(--muted);line-height:1.6}
    .hero{padding:14px 18px 18px}
    .viewer{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:360px}
    .viewer img{max-width:100%;max-height:520px;object-fit:contain;cursor:zoom-in}
    .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .thumbs img{width:74px;height:74px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer;opacity:.9}
    .thumbs img.active{outline:3px solid var(--brand);opacity:1}
    .specTable{width:100%;border-collapse:collapse;margin-top:10px}
    .specTable td{border-top:1px solid var(--line);padding:10px 0;vertical-align:top}
    .specTable td:first-child{color:var(--muted);width:34%}
    .contactRow{display:flex;flex-direction:column;gap:10px}
    .chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:999px}
    .chip small{color:var(--muted)}
    .btnBack{display:inline-flex;align-items:center;gap:8px;font-weight:900;color:#111827}
    .btnBack:hover{color:var(--brand)}
    /* Lightbox */
    .lb{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
    .lb img{max-width:min(1100px, 96vw);max-height:92vh;border-radius:18px;background:#fff}

    /* Params tables (from datasheets) */
    .paramsBlock{margin-top:18px}
    .paramsBlock h2{margin:18px 0 10px;font-size:18px}
    .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    .paramTable{border-collapse:collapse;min-width:680px;width:100%}
    .paramTable td,.paramTable th{border:1px solid var(--line);padding:8px 10px;font-size:14px;vertical-align:middle}
    .paramTable .firstRow td{font-weight:800;background:#f9fafb}

  
    /* Contact panel: sticky + compact on scroll */
    .panel{position:sticky; top:16px; align-self:flex-start; transition:transform .2s ease, padding .2s ease;}
    .panel.compact .panelPad{padding:12px;}
    .panel.compact #contactTitle{margin-bottom:6px; font-size:14px;}
    .panel.compact .chip{padding:8px 10px; border-radius:12px;}
    .panel.compact .chip small{display:none;}
    .panel.compact .chip span:last-child{opacity:.8;}

    /* Params tables */
    .paramsBlock{margin-top:16px;}
    .paramsBlock h2,.paramsBlock h3{margin:16px 0 10px;font-size:16px;}
    .paramsBlock .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff;}
    .paramsBlock table{width:100% !important; max-width:100% !important; border-collapse:collapse !important;}
    .paramsBlock td,.paramsBlock th{border:1px solid var(--line) !important; padding:10px 12px; vertical-align:top; font-size:13px; line-height:1.35;}
    .paramsBlock .paramTable td{white-space:normal;}

  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html" aria-label="Wuxing Valve Home">
        <img class="logo" src="assets/logo.png" alt="Wuxing Valve logo" />
        <div>
          <div class="brandTitle">Wuxing Valve</div>
          <div class="brandSub" id="brandSub">工业阀门 · 外贸供应</div>
        </div>
      </a>
      <div class="lang">
        <button data-lang="zh" class="active">ZH</button>
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
        <button data-lang="de">DE</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="crumbs"><a class="btnBack" id="backLink" href="index.html">← <span id="backText">返回产品页</span></a></div>

    <div class="layout">
      <div class="panel">
        <div class="hero">
          <h1 id="title">Product</h1>
          <div class="sub" id="sub"></div>
        </div>
        <div class="panelPad">
          <div class="viewer"><img id="mainImg" alt="" /></div>
          <div class="thumbs" id="thumbs"></div>

          <div style="margin-top:16px;color:#374151;line-height:1.7" id="details"></div>

          <table class="specTable" id="specs"></table>

          <div id="params" class="paramsBlock"></div>
        </div>
      </div>

      <aside class="panel" id="contactPanel">
        <div class="panelPad">
          <div style="font-weight:900;margin-bottom:10px" id="contactTitle">Contact</div>
          <div class="contactRow">
            <a class="chip" href="mailto:wengandy128@gmail.com"><span><small data-i18n="email">Email</small> wengandy128@gmail.com</span><span>↗</span></a>
            <div class="chip"><span><small data-i18n="whatsapp">WhatsApp</small></span><span>—</span></div>
            <a class="chip" href="tel:+8615888791812"><span><small data-i18n="tel">Tel</small> +86 15888791812</span><span>↗</span></a>
            <div class="chip"><span><small data-i18n="wechat">WeChat</small> 15888791812</span><span>—</span></div>
            <a class="chip" href="privacy.html"><span><small data-i18n="privacy">Privacy</small></span><span>↗</span></a>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>

<div class="lb" id="lb"><img id="lbImg" alt=""></div>

<script>
  const DATA_URL = "products.json";
  const SUPPORTED = ["zh","en","es","de"];

  const I18N = {
back: { zh:"返回产品页", en:"Back to products", es:"Volver a productos", de:"Zurück zu Produkten" },
    contact: { zh:"联系", en:"Contact", es:"Contacto", de:"Kontakt" },
    notfound: { zh:"未找到该产品", en:"Product not found", es:"Producto no encontrado", de:"Produkt nicht gefunden" },
    email: { zh:"邮箱", en:"Email", es:"Correo", de:"E‑Mail" },
    whatsapp: { zh:"WhatsApp", en:"WhatsApp", es:"WhatsApp", de:"WhatsApp" },
    tel: { zh:"电话", en:"Tel", es:"Tel", de:"Tel" },
    wechat: { zh:"微信", en:"WeChat", es:"WeChat", de:"WeChat" },
    privacy: { zh:"隐私", en:"Privacy", es:"Privacidad", de:"Datenschutz" },

  };

  const TERM_MAP = {
    en: {
      "性能规范":"Performance Specifications",
      "主要零件材料":"Main Parts & Materials",
      "主要结构尺寸、连接尺寸和重量":"Main Dimensions, Connections & Weight",
      "型号":"Model",
      "公称压力":"Nominal pressure",
      "试验压力":"Test pressure",
      "强度":"Shell",
      "密封":"Seat",
      "工作压力":"Working pressure",
      "工作温度":"Working temperature",
      "工作介质":"Service medium",
      "零件名称":"Part name",
      "材料":"Material",
      "公称通径":"DN",
      "尺 寸":"Dimensions",
      "重量":"Weight",
      "≤150摄氏度":"≤150°C",
      "≤150℃":"≤150°C"
    },
    es: {
      "性能规范":"Especificaciones de rendimiento",
      "主要零件材料":"Materiales de piezas principales",
      "主要结构尺寸、连接尺寸和重量":"Dimensiones, conexiones y peso",
      "型号":"Modelo",
      "公称压力":"Presión nominal",
      "试验压力":"Presión de prueba",
      "强度":"Cuerpo",
      "密封":"Asiento",
      "工作压力":"Presión de trabajo",
      "工作温度":"Temperatura de trabajo",
      "工作介质":"Medio",
      "零件名称":"Pieza",
      "材料":"Material",
      "公称通径":"DN",
      "尺 寸":"Dimensiones",
      "重量":"Peso",
      "≤150摄氏度":"≤150°C",
      "≤150℃":"≤150°C"
    },
    de: {
      "性能规范":"Leistungsdaten",
      "主要零件材料":"Hauptteile & Werkstoffe",
      "主要结构尺寸、连接尺寸和重量":"Hauptabmessungen, Anschlüsse & Gewicht",
      "型号":"Typ",
      "公称压力":"Nenndruck",
      "试验压力":"Prüfdruck",
      "强度":"Gehäuse",
      "密封":"Dichtheit",
      "工作压力":"Betriebsdruck",
      "工作温度":"Betriebstemperatur",
      "工作介质":"Medium",
      "零件名称":"Bauteil",
      "材料":"Werkstoff",
      "公称通径":"DN",
      "尺 寸":"Abmessungen",
      "重量":"Gewicht",
      "≤150摄氏度":"≤150°C",
      "≤150℃":"≤150°C"
    }
  };

  function translateHtmlByLang(htmlStr, lang){
    if(!htmlStr || lang === "zh") return htmlStr;
    const map = TERM_MAP[lang];
    if(!map) return htmlStr;
    // Replace longer tokens first
    const keys = Object.keys(map).sort((a,b)=>b.length-a.length);
    let out = htmlStr;
    keys.forEach(k => { out = out.split(k).join(map[k]); });
    return out;
  }


  function getLang() {
    const u = new URL(location.href);
    const q = (u.searchParams.get("lang") || "").toLowerCase();
    const stored = (localStorage.getItem("lang") || "").toLowerCase();
    return SUPPORTED.includes(q) ? q : (SUPPORTED.includes(stored) ? stored : "zh");
  }
  function setLang(lang) {
    localStorage.setItem("lang", lang);
    const u = new URL(location.href);
    u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.toString());
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
    render();
  }

  async function fetchJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("Failed to load " + url);
    return await r.json();
  }

  function q() {
    const u = new URL(location.href);
    return {
      id: u.searchParams.get("id") || "",
      lang: getLang(),
    };
  }

  function setText(lang) {
    document.documentElement.lang = lang;
    document.getElementById("backText").textContent = I18N.back[lang] || I18N.back.en;
    document.getElementById("contactTitle").textContent = I18N.contact[lang] || I18N.contact.en;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (I18N[key]) el.textContent = I18N[key][lang] || I18N[key].en || el.textContent;
    });

    const back = document.getElementById("backLink");
    back.href = `index.html?lang=${encodeURIComponent(lang)}`;
  }

  function renderThumbs(images, activeIndex, onPick) {
    const box = document.getElementById("thumbs");
    box.innerHTML = "";
    images.forEach((src, i) => {
      const im = document.createElement("img");
      im.src = src;
      im.alt = "thumb";
      im.className = (i===activeIndex) ? "active" : "";
      im.addEventListener("click", () => onPick(i));
      box.appendChild(im);
    });
  }

  function setMainImage(src, title) {
    const im = document.getElementById("mainImg");
    im.src = src;
    im.alt = title || "";
  }

  function renderSpecs(specs, lang) {
    const table = document.getElementById("specs");
    table.innerHTML = "";
    (specs || []).forEach(row => {
      const tr = document.createElement("tr");
      const k = (row.k && (row.k[lang] || row.k.en)) || "";
      const v = (row.v && (row.v[lang] || row.v.en)) || "";
      tr.innerHTML = `<td>${k}</td><td>${v}</td>`;
      table.appendChild(tr);
    });
  }

  
  function renderParams(p, lang){
    const box = document.getElementById("params");
    if(!box) return;
    const ph = p && p.params_html;
    // Use exact language if provided; otherwise fall back to zh and auto-translate key labels.
    const raw = (ph && (ph[lang] || ph.zh || ph.en)) || "";
    const html = translateHtmlByLang(raw, lang);
    box.innerHTML = html ? html : "";
  }

function enableLightbox(images, getActive) {
    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lbImg");
    document.getElementById("mainImg").onclick = () => {
      const src = images[getActive()] || "";
      if (!src) return;
      lbImg.src = src;
      lb.style.display = "flex";
    };
    lb.onclick = () => {
      lb.style.display = "none";
      lbImg.src = "";
    };
  }

  async function render() {
    const { id, lang } = q();
    setText(lang);

    try {
      const data = await fetchJSON(DATA_URL);
      const list = Array.isArray(data.products) ? data.products : [];
      const p = list.find(x => x.id === id);

      if (!p) {
        document.getElementById("title").textContent = I18N.notfound[lang] || I18N.notfound.en;
        document.getElementById("sub").textContent = "";
        document.getElementById("details").textContent = "";
        document.getElementById("thumbs").innerHTML = "";
        document.getElementById("specs").innerHTML = "";
        const pb = document.getElementById("params"); if (pb) pb.innerHTML = "";
        return;
      }

      const title = (p.title && (p.title[lang] || p.title.en)) || p.id;
      const sub = (p.sub && (p.sub[lang] || p.sub.en)) || "";
      const details = (p.details && (p.details[lang] || p.details.en)) || "";

      document.title = `Wuxing Valve · ${title}`;
      document.getElementById("title").textContent = title;
      document.getElementById("sub").textContent = sub;
      document.getElementById("details").textContent = details;

      const images = Array.isArray(p.images) && p.images.length ? p.images : (p.cover ? [p.cover] : []);
      let active = 0;
      setMainImage(images[0] || "", title);
      renderThumbs(images, active, (i) => {
        active = i;
        setMainImage(images[active], title);
        renderThumbs(images, active, arguments.callee);
      });

      renderSpecs(p.specs, lang);
      renderParams(p, lang);
      enableLightbox(images, () => active);

    } catch (e) {
      console.error(e);
      document.getElementById("title").textContent = "Failed to load data";
      document.getElementById("sub").textContent = "";
    }
  }

  document.querySelectorAll('.lang button').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });

  
  // contact panel compact on scroll
  const contactPanel = document.getElementById("contactPanel");
  function updateContactPanel(){
    if(!contactPanel) return;
    contactPanel.classList.toggle("compact", window.scrollY > 120);
  }
  window.addEventListener("scroll", updateContactPanel, { passive: true });
  updateContactPanel();

// init
  const lang = getLang();
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  render();
</script>
</body>
</html>
