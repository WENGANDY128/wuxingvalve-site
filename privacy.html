<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wuxing Valve · Privacy</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg:#f7f7f8; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --brand:#2563eb; --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:980px;margin:0 auto;padding:14px 18px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{height:34px;width:auto;display:block}
    .brandTitle{font-weight:800;letter-spacing:.2px}
    .brandSub{font-size:12px;color:var(--muted);margin-top:2px}
    .lang{display:inline-flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px}
    .lang button{border:0;background:transparent;padding:7px 10px;border-radius:999px;cursor:pointer;font-weight:700;color:#374151}
    .lang button.active{background:var(--brand);color:#fff}
    main .wrap{padding-top:22px;padding-bottom:44px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 25px rgba(0,0,0,.05)}
    .panelPad{padding:16px 18px}
    h1{margin:0 0 8px}
    p{margin:0;color:#374151;line-height:1.75}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .hint{margin-top:12px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html" aria-label="Wuxing Valve Home">
        <img class="logo" src="assets/logo.png" alt="Wuxing Valve logo" />
        <div>
          <div class="brandTitle">Wuxing Valve</div>
          <div class="brandSub">工业阀门 · 外贸供应</div>
        </div>
      </a>
      <div class="lang">
        <button data-lang="zh" class="active">ZH</button>
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
        <button data-lang="de">DE</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="panel">
      <div class="panelPad">
        <h1 id="title">隐私与统计</h1>
        <div id="content"></div>

        <div class="row" id="consentRow" style="display:none">
          <button class="btn primary" id="btnGrant">Allow analytics</button>
          <button class="btn" id="btnDeny">Disable analytics</button>
          <a class="btn" id="btnBack" href="index.html">Back</a>
        </div>

        <div class="hint" id="status"></div>
      </div>
    </div>
  </div>
</main>

<script>
  const SUPPORTED = ["zh","en","es","de"];

  const I18N = {
    title: { zh:"隐私与统计", en:"Privacy & Analytics", es:"Privacidad y analítica", de:"Datenschutz & Analyse" },
    content: {
      zh: "本页面用于管理站点的统计设置。\n",
      en: "For EN/ES/DE pages, we use Google Analytics 4 (GA4) only with your consent. You can change your preference here.\n",
      es: "Para las páginas EN/ES/DE, usamos Google Analytics 4 (GA4) solo con su consentimiento. Puede cambiar su preferencia aquí.\n",
      de: "Für EN/ES/DE-Seiten verwenden wir Google Analytics 4 (GA4) nur mit Ihrer Zustimmung. Sie können Ihre Einstellung hier ändern.\n"
    },
    grant: { en:"Allow analytics", es:"Permitir analítica", de:"Analyse erlauben" },
    deny: { en:"Disable analytics", es:"Desactivar analítica", de:"Analyse deaktivieren" },
    back: { zh:"返回", en:"Back", es:"Volver", de:"Zurück" },
    statusGranted: { en:"Status: allowed", es:"Estado: permitido", de:"Status: erlaubt" },
    statusDenied: { en:"Status: disabled", es:"Estado: desactivado", de:"Status: deaktiviert" },
    statusNA: { zh:"中文页面默认启用站点统计。", en:"Status: not set", es:"Estado: no establecido", de:"Status: nicht gesetzt" },
  };

  function getLang() {
    const u = new URL(location.href);
    const q = (u.searchParams.get("lang") || "").toLowerCase();
    const stored = (localStorage.getItem("lang") || "").toLowerCase();
    return SUPPORTED.includes(q) ? q : (SUPPORTED.includes(stored) ? stored : "zh");
  }
  function setLang(lang) {
    localStorage.setItem("lang", lang);
    const u = new URL(location.href);
    u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.toString());
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
    render();
  }
  function consentKey(lang) { return `ga4_consent_${lang}`; }

  function render() {
    const lang = getLang();
    document.documentElement.lang = lang;
    document.getElementById("title").textContent = I18N.title[lang] || I18N.title.en;
    document.getElementById("btnBack").textContent = I18N.back[lang] || I18N.back.en;
    document.getElementById("btnBack").href = `index.html?lang=${encodeURIComponent(lang)}`;

    const content = document.getElementById("content");
    content.innerHTML = "";
    const p = document.createElement("p");
    p.textContent = (I18N.content[lang] || I18N.content.en).trim();
    content.appendChild(p);

    const row = document.getElementById("consentRow");
    const status = document.getElementById("status");

    if (lang === "zh") {
      row.style.display = "none";
      status.textContent = I18N.statusNA.zh;
      return;
    }

    row.style.display = "flex";
    document.getElementById("btnGrant").textContent = I18N.grant[lang] || I18N.grant.en;
    document.getElementById("btnDeny").textContent = I18N.deny[lang] || I18N.deny.en;

    const key = consentKey(lang);
    const state = localStorage.getItem(key);
    if (state === "granted") status.textContent = I18N.statusGranted[lang] || I18N.statusGranted.en;
    else if (state === "denied") status.textContent = I18N.statusDenied[lang] || I18N.statusDenied.en;
    else status.textContent = I18N.statusNA[lang] || I18N.statusNA.en;

    document.getElementById("btnGrant").onclick = () => {
      localStorage.setItem(key, "granted");
      render();
    };
    document.getElementById("btnDeny").onclick = () => {
      localStorage.setItem(key, "denied");
      render();
    };
  }

  document.querySelectorAll('.lang button').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });

  const lang = getLang();
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  render();
</script>
</body>
</html>
